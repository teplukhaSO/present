<h2 class="challenge-title">Підбери пароль</h2>
<p class="challenge-hint">
  Введи HEX-код кольору матричного коду на цьому сайті (без #)
</p>
<div class="challenge-code led-swatch">■■■■■</div>

<input
  class="challenge-input"
  [class.is-invalid]="error"
  type="text"
  placeholder="000000"
  [(ngModel)]="answer"
  (keyup.enter)="submit()"
/>
<button class="challenge-btn" type="button" (click)="submit()">Розблокувати</button>

<p class="challenge-feedback" [class.is-error]="error">{{ error ? 'Невірний код. Спробуй ще раз.' : '' }}</p>
