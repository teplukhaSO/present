<h2 class="challenge-title">🦆 Пояснення качці</h2>
<p class="challenge-hint">Качка не розуміє, чому ця перевірка завжди спрацьовує. Обери правильний варіант.</p>
<div class="challenge-code">{{ brokenLine }}</div>

<div class="challenge-options">
  @for (option of options; track option.text) {
    <button
      class="option-btn"
      type="button"
      [class.is-wrong]="selected === option && !option.correct"
      [class.is-correct]="selected === option && option.correct"
      (click)="select(option)"
    >
      {{ option.text }}
    </button>
  }
</div>

<p class="challenge-feedback" [class.is-error]="selected && !selected.correct">
  {{ selected && !selected.correct ? 'Качка досі спантеличена. Спробуй інший варіант.' : '' }}
</p>
