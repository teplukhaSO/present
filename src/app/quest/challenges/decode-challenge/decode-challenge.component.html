<h2 class="challenge-title">Розшифруй повідомлення</h2>
<p class="challenge-hint">Рядок нижче закодовано в Base64. Розшифруй і введи результат.</p>
<div class="challenge-code">{{ encoded }}</div>

<input
  class="challenge-input"
  [class.is-invalid]="error"
  type="text"
  placeholder="ВІДПОВІДЬ"
  [(ngModel)]="answer"
  (keyup.enter)="submit()"
/>
<button class="challenge-btn" type="button" (click)="submit()">Перевірити</button>

<p class="challenge-feedback" [class.is-error]="error">{{ error ? 'Невірно. Спробуй ще раз.' : '' }}</p>
