<h2 class="challenge-title">Знайди баг</h2>
<p class="challenge-hint">Один рядок коду містить помилку. Клацни на нього.</p>
<pre class="challenge-code">{{ snippet }}</pre>

<div class="challenge-options">
  @for (option of options; track option.text) {
    <button
      class="option-btn"
      type="button"
      [class.is-wrong]="selected === option && !option.correct"
      [class.is-correct]="selected === option && option.correct"
      (click)="select(option)"
    >
      {{ option.text }}
    </button>
  }
</div>

<p class="challenge-feedback" [class.is-error]="selected && !selected.correct">
  {{ selected && !selected.correct ? 'Не тут. Спробуй інший рядок.' : '' }}
</p>
